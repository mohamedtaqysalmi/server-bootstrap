name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu version
      description: Output of `lsb_release -ds`
      placeholder: Ubuntu 24.04.1 LTS
    validations:
      required: true
  - type: dropdown
    id: rerun
    attributes:
      label: Was this a re-run?
      options:
        - First run on a fresh server
        - Re-run on a server already bootstrapped
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      description: Output of `./bootstrap.sh --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output. Remove IP addresses, hostnames and anything secret first.
      render: text
