name: Feature request
description: Suggest a step or an option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you add?
      description: Every step has to be idempotent and support dry-run. Say how this one could be.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
