name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  shfmt:
    runs-on: ubuntu-24.04
    env:
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shfmt
        run: |
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum -c -
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt
      - name: shfmt -d
        run: git ls-files -z '*.sh' | xargs -0 shfmt -d

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/test_cli.sh in ubuntu:24.04
        run: docker run --rm -v "$PWD":/work -w /work ubuntu:24.04 bash tests/test_cli.sh
      - name: tests/test_steps.sh in ubuntu:24.04
        run: |
          docker run --rm \
            -e BOOTSTRAP_TEST_IN_CONTAINER=1 \
            -v "$PWD":/src:ro -w /src \
            ubuntu:24.04 bash tests/test_steps.sh
